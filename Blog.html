<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore the UK - Top 10 Iconic Places</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }

    header {
      background: #1e293b;
      padding: 2rem 1.5rem;
      text-align: center;
      border-bottom: 2px solid #334155;
    }

    header h1 {
      color: #38bdf8;
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }

    header p {
      color: #94a3b8;
    }

    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* Grid View */
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    .blog-card {
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .blog-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(56, 189, 248, 0.2);
    }

    .blog-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card-content {
      padding: 1.5rem;
    }

    .card-content h3 {
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }

    .card-content p {
      color: #cbd5e1;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .read-btn {
      display: inline-block;
      color: #38bdf8;
      font-weight: bold;
      text-decoration: none;
    }

    /* Detailed Single Page View */
    .blog-detail {
      display: none;
      background: #1e293b;
      border-radius: 12px;
      padding: 2rem;
      border: 1px solid #334155;
    }

    .blog-detail img {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }

    .blog-detail h2 {
      color: #38bdf8;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .blog-detail .meta {
      color: #38bdf8;
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .blog-detail .content {
      color: #e2e8f0;
      font-size: 1.05rem;
      line-height: 1.8;
    }

    .back-btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 1.5rem;
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: #64748b;
      border-top: 1px solid #334155;
      margin-top: 3rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Explore the United Kingdom</h1>
    <p>Discover 10 iconic, historic, and beautiful destinations across the UK</p>
  </header>

  <div class="container">
    <!-- Grid view for 10 blog posts -->
    <div id="blog-grid" class="blog-grid"></div>

    <!-- Article Detail View -->
    <div id="blog-detail" class="blog-detail">
      <button class="back-btn" onclick="showGrid()">← Back to All Destinations</button>
      <img id="detail-img" src="" alt="">
      <h2 id="detail-title"></h2>
      <div id="detail-meta" class="meta"></div>
      <div id="detail-content" class="content"></div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 UK Travel Guide. All rights reserved.</p>
  </footer>

  <script>
    const blogs = [
      {
        id: 1,
        title: "Big Ben & Palace of Westminster",
        location: "London, England",
        image: "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=1000&q=80",
        summary: "London's most famous landmark and iconic clock tower.",
        content: "Big Ben is the nickname for the Great Bell of the striking clock at the north end of the Palace of Westminster in London. Towering over the River Thames, this iconic landmark represents the political heart of the United Kingdom and is one of London's most recognizable architectural marvels, especially beautiful when illuminated at night."
      },
      {
        id: 2,
        title: "Stonehenge",
        location: "Wiltshire, England",
        image: "https://images.unsplash.com/photo-1599833975787-5c143f373c30?auto=format&fit=crop&w=1000&q=80",
        summary: "World-famous prehistoric monument wrapped in ancient mystery.",
        content: "Stonehenge is a world-renowned prehistoric monument created around 3000 BC to 2000 BC. Composed of massive standing stones arranged in a unique ring formation, it remains one of the greatest archaeological mysteries in human history, attracting travelers interested in ancient culture and astronomy."
      },
      {
        id: 3,
        title: "Edinburgh Castle",
        location: "Edinburgh, Scotland",
        image: "https://images.unsplash.com/photo-1506377247377-2a5b3b417ebb?auto=format&fit=crop&w=1000&q=80",
        summary: "Historic fortress dominating the skyline of Scotland's capital.",
        content: "Perched atop Castle Rock—an extinct volcanic crag—Edinburgh Castle dominates the skyline of Scotland's capital city. Rich in royal history, this fortress houses the Crown Jewels of Scotland (the Honors of Scotland) and provides breathtaking panoramic views of the entire city."
      },
      {
        id: 4,
        title: "Giant's Causeway",
        location: "County Antrim, Northern Ireland",
        image: "https://images.unsplash.com/photo-1590059301980-8641b99ff1e3?auto=format&fit=crop&w=1000&q=80",
        summary: "Geological wonder formed by 40,000 interlocking basalt columns.",
        content: "Giant's Causeway is Northern Ireland's only UNESCO World Heritage Site. Formed by ancient volcanic eruptions, this stunning natural site features around 40,000 interlocking hexagonal basalt columns stepping down into the Irish Sea, wrapped in captivating local mythology."
      },
      {
        id: 5,
        title: "Tower Bridge",
        location: "London, England",
        image: "https://images.unsplash.com/photo-1529655683826-aba9b3e77383?auto=format&fit=crop&w=1000&q=80",
        summary: "Victorian-era bascule bridge crossing the River Thames.",
        content: "Built in 1894, Tower Bridge is a historic combination of bascule and suspension bridge structures. Visitors can walk across its high-level glass floor walkways to enjoy panoramic vistas of London and observe the historic engine rooms that power the bridge lifts."
      },
      {
        id: 6,
        title: "Loch Ness & Urquhart Castle",
        location: "Highlands, Scotland",
        image: "https://images.unsplash.com/photo-1508873696983-2df515122519?auto=format&fit=crop&w=1000&q=80",
        summary: "Deep Scottish lake known for its scenery and mythical monster.",
        content: "Loch Ness is a deep freshwater loch in the Scottish Highlands, worldwide famous for sightings of the mythical 'Nessie' monster. Nestled on its shores are the scenic ruins of Urquhart Castle, making it a favorite destination for boat cruises and historic sightseeing."
      },
      {
        id: 7,
        title: "The Roman Baths",
        location: "Bath, England",
        image: "https://images.unsplash.com/photo-1543783207-ec64e4d95325?auto=format&fit=crop&w=1000&q=80",
        summary: "Extensive preserved ancient Roman bathing complex.",
        content: "Located in the historic city of Bath, the Roman Baths are among the best-preserved Roman sites in Northern Europe. Fed by thermal hot springs that produce natural hot water, the complex showcases intact ancient bathhouses, temples, and Roman artifacts."
      },
      {
        id: 8,
        title: "Snowdonia National Park",
        location: "Gwynedd, Wales",
        image: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1000&q=80",
        summary: "Majestic mountains and outdoor adventures in Wales.",
        content: "Snowdonia National Park (Eryri) in North Wales features dramatic mountain landscapes, including Mount Snowdon—the highest peak in England and Wales. It is a haven for outdoor enthusiasts offering world-class hiking, mountain railway tours, and pristine glacial lakes."
      },
      {
        id: 9,
        title: "The Lake District",
        location: "Cumbria, England",
        image: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1000&q=80",
        summary: "England's premier national park famous for lakes and fells.",
        content: "The Lake District National Park is renowned for its scenic lakes, rugged mountains, and charming stone villages. Highlights include Lake Windermere and Scafell Pike, providing options for sailing, hiking, and exploring historic literary connections to writers like Beatrix Potter."
      },
      {
        id: 10,
        title: "Windsor Castle",
        location: "Windsor, Berkshire, England",
        image: "https://images.unsplash.com/photo-1568084680786-a84f91d1153c?auto=format&fit=crop&w=1000&q=80",
        summary: "The oldest and largest occupied castle in the world.",
        content: "Windsor Castle has served as an official royal residence for over 1,000 years. Visitors can tour the lavish State Apartments decorated with masterpieces from the Royal Collection and visit St George's Chapel, an exquisite example of Gothic architecture."
      }
    ];

    function renderBlogs() {
      const grid = document.getElementById('blog-grid');
      grid.innerHTML = blogs.map(blog => `
        <div class="blog-card" onclick="showDetail(${blog.id})">
          <img src="${blog.image}" alt="${blog.title}">
          <div class="card-content">
            <h3>${blog.title}</h3>
            <p style="color: #38bdf8; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px;">📍 ${blog.location}</p>
            <p>${blog.summary}</p>
            <span class="read-btn">Read Full Article →</span>
          </div>
        </div>
      `).join('');
    }

    function showDetail(id) {
      const blog = blogs.find(b => b.id === id);
      if (!blog) return;

      document.getElementById('detail-img').src = blog.image;
      document.getElementById('detail-img').alt = blog.title;
      document.getElementById('detail-title').innerText = blog.title;
      document.getElementById('detail-meta').innerText = `Location: ${blog.location}`;
      document.getElementById('detail-content').innerText = blog.content;

      document.getElementById('blog-grid').style.display = 'none';
      document.getElementById('blog-detail').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function showGrid() {
      document.getElementById('blog-detail').style.display = 'none';
      document.getElementById('blog-grid').style.display = 'grid';
    }

    renderBlogs();
  </script>
</body>
</html>
