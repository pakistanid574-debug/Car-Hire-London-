<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edinburgh & UK Festival Countdown</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Edinburgh Midnight Blue & Royal Theme */
            background: radial-gradient(circle at top, #1a2a40 0%, #0a1118 100%);
            color: #f8fafc;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* Subtle Tartan Pattern Overlay */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(212, 175, 55, 0.03) 40px, rgba(212, 175, 55, 0.03) 41px),
                repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(212, 175, 55, 0.03) 40px, rgba(212, 175, 55, 0.03) 41px);
            pointer-events: none;
            z-index: 0;
        }

        /* Header Styling */
        header {
            text-align: center;
            padding: 3rem 1rem 1.5rem;
            background: rgba(10, 17, 24, 0.6);
            border-bottom: 2px solid #d4af37;
            position: relative;
            z-index: 1;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: #d4af37;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.2);
            margin-bottom: 0.3rem;
        }

        header p {
            color: #94a3b8;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        /* Main Event Card */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2.5rem 1rem;
            flex-grow: 1;
            position: relative;
            z-index: 1;
        }

        .event-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 8px;
            padding: 3rem 2rem;
            max-width: 650px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(212, 175, 55, 0.05);
            position: relative;
        }

        .event-card::before {
            content: '🏰';
            font-size: 2rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        .event-title {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .event-date {
            color: #d4af37;
            font-size: 1rem;
            letter-spacing: 1px;
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        /* Countdown Grid */
        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .time-box {
            background: rgba(10, 17, 24, 0.8);
            padding: 1.2rem 0.5rem;
            border-radius: 6px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            transition: transform 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-3px);
            border-color: #d4af37;
        }

        .number {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
            display: block;
            line-height: 1;
            margin-bottom: 0.4rem;
        }

        .label {
            font-size: 0.7rem;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .celebrate-msg {
            display: none;
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: bold;
            color: #d4af37;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.05); opacity: 1; }
        }

        /* Footer Styling */
        footer {
            background: #060a0f;
            padding: 2rem 1rem;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        footer p {
            color: #64748b;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .brand-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3rem;
            flex-wrap: wrap;
        }

        .brand-logos svg {
            fill: #64748b;
            height: 32px;
            width: auto;
            transition: all 0.3s ease;
        }

        .brand-logos svg:hover {
            fill: #d4af37;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <header>
        <h1>🏴󠁧󠁢󠁳󠁣󠁴󠁿 Edinburgh Festival Countdown</h1>
        <p>Royal Celebrations & Historic Events</p>
    </header>

    <main>
        <div class="event-card">
            <h2 class="event-title" id="event-name">Loading Festival...</h2>
            <p class="event-date" id="event-date"></p>

            <div class="countdown" id="countdown-box">
                <div class="time-box"><span class="number" id="days">00</span><span class="label">Days</span></div>
                <div class="time-box"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
                <div class="time-box"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
                <div class="time-box"><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
            </div>

            <div class="celebrate-msg" id="celebrate-msg"> 🎆 CELEBRATING NOW IN EDINBURGH! 🏰 </div>
        </div>
    </main>

    <footer>
        <p>Official Partners & Sponsors</p>
        <div class="brand-logos">
            <svg viewBox="0 0 300 60" title="British Airways">
                <path d="M 10,35 Q 80,5 150,25 Q 220,45 280,15 L 290,25 Q 210,60 140,35 Q 70,10 10,45 Z"/>
                <text x="10" y="25" font-family="'Cinzel', serif" font-size="18" font-weight="bold">BRITISH AIRWAYS</text>
            </svg>

            <svg viewBox="0 0 200 60" title="Air Arabia">
                <path d="M 20,40 Q 50,10 100,25 Q 150,40 180,15 L 170,45 Q 130,50 90,35 Z"/>
                <text x="25" y="25" font-family="'Cinzel', serif" font-size="16" font-weight="bold">Air Arabia</text>
            </svg>

            <svg viewBox="0 0 100 50" title="Nike">
                <path d="M 10.18 25.07 C 18.73 29.83 31.95 36.19 44.91 36.19 C 73.12 36.19 95 12 95 12 C 95 12 60.1 27.8 42.14 24.3 C 31.91 22.31 18.42 15.1 10.18 25.07 Z"/>
            </svg>
        </div>
    </footer>

    <script>
        // Edinburgh & UK Upcoming Festivals List
        const edinburghFestivals = [
            { name: "Edinburgh Fringe Festival", date: new Date("Aug 7, 2026 00:00:00").getTime() },
            { name: "Royal Edinburgh Military Tattoo", date: new Date("Aug 7, 2026 00:00:00").getTime() },
            { name: "Bonfire Night (Guy Fawkes)", date: new Date("Nov 5, 2026 00:00:00").getTime() },
            { name: "Edinburgh's Hogmanay (NYE)", date: new Date("Dec 31, 2026 23:59:59").getTime() },
            { name: "Burns Night", date: new Date("Jan 25, 2027 00:00:00").getTime() }
        ];

        let now = new Date().getTime();
        let currentFestival = edinburghFestivals.find(f => f.date > now) || edinburghFestivals[0];

        document.getElementById('event-name').innerText = currentFestival.name;
        document.getElementById('event-date').innerText = new Date(currentFestival.date).toDateString();

        let isCelebrating = false;

        function updateCountdown() {
            const currentTime = new Date().getTime();
            const distance = currentFestival.date - currentTime;

            if (distance <= 0) {
                if (!isCelebrating) {
                    isCelebrating = true;
                    document.getElementById('countdown-box').style.display = 'none';
                    document.getElementById('celebrate-msg').style.display = 'block';
                    triggerConfetti();
                }
                return;
            }

            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = d < 10 ? '0' + d : d;
            document.getElementById('hours').innerText = h < 10 ? '0' + h : h;
            document.getElementById('minutes').innerText = m < 10 ? '0' + m : m;
            document.getElementById('seconds').innerText = s < 10 ? '0' + s : s;
        }

        function triggerConfetti() {
            var duration = 15 * 1000;
            var animationEnd = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#d4af37', '#ffffff', '#005eb8']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#d4af37', '#ffffff', '#005eb8']
                });

                if (Date.now() < animationEnd) {
                    requestAnimationFrame(frame);
                }
            })();
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
