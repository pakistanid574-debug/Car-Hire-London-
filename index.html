<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 1rem;
    }
    h1 {
      font-size: 8rem;
      font-weight: 800;
      color: #38bdf8;
      line-height: 1;
    }
    h2 {
      font-size: 2rem;
      margin-top: 1rem;
    }
    p {
      color: #94a3b8;
      margin: 1rem 0 2rem;
      max-width: 400px;
    }
    .btn {
      background-color: #38bdf8;
      color: #0f172a;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: #0284c7;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <h1>404</h1>
  <h2>Page Not Found</h2>
  <p>Jo page aap dhoond rahe hain woh shayad delete ho gaya hai ya galat URL type hua hai.</p>
  
  <a href="/" class="btn" id="homeBtn">Go Back Home</a>

  <script>
    // JS to optionally handle auto-redirect or button click logic
    document.getElementById('homeBtn').addEventListener('click', (e) => {
      // Custom logic here if needed before redirect
      console.log("Redirecting user back to home...");
    });
  </script>

</body>
</html>
