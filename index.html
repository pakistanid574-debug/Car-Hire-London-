<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #050709;
            color: #F0F4F8;
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 {
            font-size: 6rem;
            color: #D4AF37;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            color: #8E9BAE;
            margin-bottom: 20px;
        }
        a {
            color: #D4AF37;
            text-decoration: none;
            border: 1px solid #D4AF37;
            padding: 10px 20px;
            border-radius: 5px;
            transition: 0.3s;
        }
        a:hover {
            background-color: #D4AF37;
            color: #050709;
        }
        footer {
            padding: 20px;
            font-size: 0.9rem;
            color: #8E9BAE;
        }
        footer span {
            color: #D4AF37;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Oops! The page you are looking for does not exist.</p>
        <a href="/">Go Back Home</a>
    </div>
    <footer>
        Created by <span>Hassan Alvi</span> & <span>Rao Ubaid</span>
    </footer>
</body>
</html>
