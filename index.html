<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This site can't be reached</title>

<style>
body {
  margin: 0;
  background: #fff;
  font-family: Arial, sans-serif;
  color: #202124;
}

.page {
  max-width: 620px;
  margin: 110px auto;
  padding: 20px;
}

.icon {
  width: 70px;
  height: 82px;
  margin-bottom: 28px;
  position: relative;
}

.paper {
  width: 48px;
  height: 62px;
  border: 3px solid #9aa0a6;
  border-radius: 5px;
  position: absolute;
  left: 8px;
  top: 5px;
}

.paper:before {
  content: "";
  position: absolute;
  width: 20px;
  height: 20px;
  background: white;
  border-left: 3px solid #9aa0a6;
  border-bottom: 3px solid #9aa0a6;
  right: -3px;
  top: -3px;
}

.eye {
  position: absolute;
  width: 7px;
  height: 7px;
  background: #9aa0a6;
  border-radius: 50%;
  top: 30px;
}

.eye.left {
  left: 20px;
}

.eye.right {
  left: 39px;
}

.mouth {
  position: absolute;
  width: 17px;
  height: 8px;
  border-top: 3px solid #9aa0a6;
  border-radius: 50%;
  left: 23px;
  top: 45px;
}

h1 {
  font-size: 28px;
  font-weight: 400;
  margin: 0 0 18px;
}

p {
  color: #5f6368;
  font-size: 15px;
  line-height: 1.6;
  margin: 0;
}

.error {
  margin-top: 25px;
  font-size: 14px;
  color: #5f6368;
}

button {
  margin-top: 30px;
  padding: 10px 22px;
  border: 0;
  border-radius: 4px;
  background: #1a73e8;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

button:hover {
  background: #1765cc;
}
</style>
</head>

<body>

<div class="page">

  <div class="icon">
    <div class="paper"></div>
    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="mouth"></div>
  </div>

  <h1>This site can’t be reached</h1>

  <p>
    The webpage might be temporarily down or it may have moved
    permanently to a new web address.
  </p>

  <div class="error">
    ERR_CONNECTION_REFUSED
  </div>

  <button onclick="location.reload()">Reload</button>

</div>

</body>
</html>
