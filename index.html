<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Festival Countdown & Celebration</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header Styling */
        header {
            text-align: center;
            padding: 2.5rem 1rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        header h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }

        /* Main Event Card */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            flex-grow: 1;
        }

        .event-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .event-title {
            font-size: 1.8rem;
            color: #f1f5f9;
            margin-bottom: 0.5rem;
        }

        .event-date {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        /* Countdown Grid */
        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .number {
            font-size: 2.2rem;
            font-weight: bold;
            color: #38bdf8;
            display: block;
        }

        .label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .celebrate-msg {
            display: none;
            font-size: 1.8rem;
            font-weight: bold;
            color: #4ade80;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        /* Footer Styling */
        footer {
            background: #090d16;
            padding: 2rem 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        footer p {
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
        }

        .brand-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2.5rem;
            flex-wrap: wrap;
        }

        .brand-logos svg {
            fill: #94a3b8;
            height: 35px;
            width: auto;
            transition: all 0.3s ease;
        }

        .brand-logos svg:hover {
            fill: #ffffff;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <header>
        <h1>🇬🇧 UK Upcoming Festivals</h1>
        <p>Live Countdown & Celebration</p>
    </header>

    <main>
        <div class="event-card">
            <h2 class="event-title" id="event-name">Loading Festival...</h2>
            <p class="event-date" id="event-date"></p>

            <div class="countdown" id="countdown-box">
                <div class="time-box"><span class="number" id="days">00</span><span class="label">Days</span></div>
                <div class="time-box"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
                <div class="time-box"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
                <div class="time-box"><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
            </div>

            <div class="celebrate-msg" id="celebrate-msg"> 🎉 HAPPY FESTIVAL! CELEBRATING NOW! 🥳 </div>
        </div>
    </main>

    <footer>
        <p>Official Partners & Sponsors</p>
        <div class="brand-logos">
            <svg viewBox="0 0 300 60" title="British Airways">
                <path d="M 10,35 Q 80,5 150,25 Q 220,45 280,15 L 290,25 Q 210,60 140,35 Q 70,10 10,45 Z" fill="#eb2226"/>
                <text x="10" y="25" font-family="Arial" font-size="20" font-weight="bold" fill="#ffffff">BRITISH AIRWAYS</text>
            </svg>

            <svg viewBox="0 0 200 60" title="Air Arabia">
                <path d="M 20,40 Q 50,10 100,25 Q 150,40 180,15 L 170,45 Q 130,50 90,35 Z" fill="#e11932"/>
                <text x="25" y="25" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff">Air Arabia</text>
            </svg>

            <svg viewBox="0 0 100 50" title="Nike">
                <path d="M 10.18 25.07 C 18.73 29.83 31.95 36.19 44.91 36.19 C 73.12 36.19 95 12 95 12 C 95 12 60.1 27.8 42.14 24.3 C 31.91 22.31 18.42 15.1 10.18 25.07 Z"/>
            </svg>
        </div>
    </footer>

    <script>
        // UK Upcoming Festivals List
        const ukFestivals = [
            { name: "Bonfire Night (Guy Fawkes)", date: new Date("Nov 5, 2026 00:00:00").getTime() },
            { name: "Christmas Eve UK", date: new Date("Dec 24, 2026 00:00:00").getTime() },
            { name: "London New Year's Eve", date: new Date("Dec 31, 2026 23:59:59").getTime() },
            { name: "Glastonbury Festival", date: new Date("Jun 23, 2027 00:00:00").getTime() }
        ];

        // Pick current or next upcoming festival
        let now = new Date().getTime();
        let currentFestival = ukFestivals.find(f => f.date > now) || ukFestivals[0];

        // Display Info
        document.getElementById('event-name').innerText = currentFestival.name;
        document.getElementById('event-date').innerText = new Date(currentFestival.date).toDateString();

        let isCelebrating = false;

        function updateCountdown() {
            const currentTime = new Date().getTime();
            const distance = currentFestival.date - currentTime;

            if (distance <= 0) {
                // Trigger Celebration Mode
                if (!isCelebrating) {
                    isCelebrating = true;
                    document.getElementById('countdown-box').style.display = 'none';
                    document.getElementById('celebrate-msg').style.display = 'block';
                    triggerConfetti();
                }
                return;
            }

            // Calculation
            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);

            // Output
            document.getElementById('days').innerText = d < 10 ? '0' + d : d;
            document.getElementById('hours').innerText = h < 10 ? '0' + h : h;
            document.getElementById('minutes').innerText = m < 10 ? '0' + m : m;
            document.getElementById('seconds').innerText = s < 10 ? '0' + s : s;
        }

        // Automatic Confetti Firework Function
        function triggerConfetti() {
            var duration = 15 * 1000;
            var animationEnd = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });

                if (Date.now() < animationEnd) {
                    requestAnimationFrame(frame);
                }
            })();
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
