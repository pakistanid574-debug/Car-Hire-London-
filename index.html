<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- SEO Meta Tags -->
  <title>Private Driver Norway | Executive Chauffeur & Oslo Airport Transfers</title>
  <meta name="description" content="Book premium private driver & luxury chauffeur services in Norway. Specialized in Oslo Airport (Gardermoen OSL) transfers, Bergen tours, and VIP travel." />
  <meta name="robots" content="index, follow" />

  <!-- Canonical & Geo-Targeting -->
  <link rel="canonical" href="https://private-driver-norway.vercel.app/" />
  <link rel="alternate" hreflang="en-no" href="https://private-driver-norway.vercel.app/" />

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "TaxiService",
    "name": "Private Driver Norway",
    "url": "https://private-driver-norway.vercel.app/",
    "serviceType": ["Airport Transfer", "Executive Chauffeur", "VIP Transport"],
    "priceRange": "NOK"
  }
  </script>
</head>
<body style="margin:0; font-family: Arial, sans-serif; background-color:#0f172a; color:#ffffff;">

  <!-- Header Section -->
  <header style="padding: 20px; background-color: #1e293b; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155;">
    <div style="font-size: 20px; font-weight: bold; color: #38bdf8;">Private Driver Norway</div>
    <!-- Booking Button with Dynamic WhatsApp Link -->
    <a id="whatsapp-btn" href="#" target="_blank" style="background:#38bdf8; color:#0f172a; padding:12px 24px; text-decoration:none; font-weight:bold; border-radius:6px;">Book via WhatsApp</a>
  </header>

  <!-- Dynamic User ID Display Banner -->
  <div style="background-color: #1e1b4b; border-bottom: 1px solid #6366f1; padding: 10px; text-align: center; font-size: 14px; color: #a5b4fc;">
    Your Booking Tracking ID: <strong id="user-id-display" style="color: #ffffff;">Loading...</strong>
  </div>

  <!-- Hero Section -->
  <section style="padding: 70px 20px; text-align: center;">
    <h1 style="font-size: 36px; margin-bottom: 15px;">Executive Private Driver & Chauffeur Service in Norway</h1>
    <p style="font-size: 18px; color: #94a3b8; max-width: 700px; margin: 0 auto 30px auto;">
      Luxury transfers for Oslo Airport (Gardermoen OSL), Bergen, Stavanger, and private tours.
    </p>
    <a id="hero-whatsapp-btn" href="#" target="_blank" style="background:#0284c7; color:#ffffff; padding:15px 30px; font-size:16px; text-decoration:none; font-weight:bold; border-radius:6px;">Book Ride Now</a>
  </section>

  <!-- Automatic Dynamic ID Script -->
  <script>
    // 1. Apna WhatsApp Number yahan darj karein (Country Code ke sath, bina '+' ke)
    const whatsappNumber = "YOUR_PHONE_NUMBER_HERE"; // Example: "923001234567" or "4712345678"

    // 2. Function to fetch ID from URL parameters or generate auto ID
    function getOrGenerateID() {
      const urlParams = new URLSearchParams(window.location.search);
      let clientID = urlParams.get('id');

      // Agar URL me ID nahi mili, toh random Auto-ID banayein
      if (!clientID) {
        clientID = 'AUTO-' + Math.floor(1000 + Math.random() * 9000);
      }
      return clientID;
    }

    // 3. Update Page & WhatsApp Links
    const activeID = getOrGenerateID();
    
    // Display ID on page
    document.getElementById('user-id-display').innerText = activeID;

    // Custom WhatsApp Message with Tracking ID
    const message = encodeURIComponent(`Hi, I would like to book a private driver in Norway. My Booking Reference ID is: [${activeID}]`);
    const whatsappURL = `https://wa.me/${whatsappNumber}?text=${message}`;

    // Update buttons href
    document.getElementById('whatsapp-btn').href = whatsappURL;
    document.getElementById('hero-whatsapp-btn').href = whatsappURL;
  </script>

</body>
</html>
